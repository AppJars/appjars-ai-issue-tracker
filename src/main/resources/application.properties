# --- Database ----------------------------------------------------------------
# In-memory H2: nothing to install. The schema is created at boot and dropped on shutdown.
# Point spring.datasource at a real database (and swap the driver in pom.xml) to keep data.
spring.datasource.url=jdbc:h2:mem:issue-tracker;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;MODE=PostgreSQL;NON_KEYWORDS=VALUE
spring.datasource.username=sa
spring.datasource.password=
# AppJars create and populate their own tables on first run through Hibernate. There is no
# Flyway/Liquibase to maintain for them.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true

# --- AppJars -----------------------------------------------------------------
# A license key lifts the record and operation limits of free mode. Nothing is needed to evaluate.
# https://www.appjars.com/
# com.appjars.license.key=

# --- Vaadin ------------------------------------------------------------------
# Packages Vaadin scans for components and views. com.appjars and com.flowingcode must be listed
# or the AppJar views are never registered.
vaadin.allowed-packages=com.vaadin,org.vaadin,com.example.issuetracker,com.flowingcode,com.appjars
# Open the browser when the application starts in development mode.
vaadin.launch-browser=true

# --- User Manager ---------------------------------------------------------------
# https://docs.appjars.com/user-manager/overview/
# Signs the persistent remember-me tokens. Change it; the default is public.
com.appjars.usermanager.encoding.secret.key=change-me-before-going-to-production
# Base URL written into registration and password-reset links.
com.appjars.usermanager.external-url=http://localhost:8080
# Only for external authentication providers (OAuth2): base64-encoded 32-byte AES key, e.g. `openssl rand -base64 32`.
# com.appjars.usermanager.external-auth.secret.key=

# --- Activity Log ---------------------------------------------------------------
# https://docs.appjars.com/activity-log/overview/
# Whether the scheduled pruner may delete the logs the active removers cover (default shown).
# com.appjars.activitylog.logspruner.removalEnabled=true
# Fail startup when log capture cannot be set up (Log4j2 not active). Default shown; keep it, it turns a silent capture failure into a clear error.
# com.appjars.activitylog.appender.strict=true

# --- Issue Tracker ---------------------------------------------------------------
# https://docs.appjars.com/issue-tracker/overview/
# User Manager authenticates users; Issue Tracker mirrors them and does not manage passwords itself.
appjars.issuetracker.auth.enabled=false
# SMTP server for issue notifications. Override with the SPRING_MAIL_* environment variables (see .env.example); until a real server is configured, sending fails and is logged.
spring.mail.host=localhost
spring.mail.port=25
spring.mail.protocol=smtp
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=true
# Directory where issue attachments are stored (default shown).
appjars.issuetracker.attachment.file-path=files/
# Public base URL used in notification emails.
appjars.issuetracker.url.base=http://localhost:8080/
